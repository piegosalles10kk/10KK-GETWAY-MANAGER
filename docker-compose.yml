version: '3.8'

services:
  # --- 1. API GATEWAY MANAGER (Seu Serviço Principal) ---
  gateway:
    build: .
    container_name: api-gateway-manager-on
    ports:
      - "8000:8000"
    restart: always
    environment:
      MONGO_URI: mongodb://mongo-db:27017/api-gateway-db
      REDIS_URL: redis://redis:6379  # ✨ NOVO
      JWT_SECRET: PieGoCAmiSa10
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: password123
      PORT_CHECK_HOST: 172.17.0.1 
    depends_on:
      - mongo-db
      - redis  # ✨ NOVO
      
  # --- 2. MONGODB DATABASE ---
  mongo-db:
    image: mongo:4.4
    container_name: mongodb
    ports:
      - "27018:27018"
    volumes:
      - mongo-data:/data/db

  # --- 3. REDIS CACHE (✨ NOVO) ---
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass yourRedisPassword123  # ✨ Senha opcional para produção

volumes:
  mongo-data:
  redis-data:  # ✨ NOVO